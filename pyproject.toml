[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "l0mkl"
version = "0.1.0"
description = "Sparse multiple-kernel learning with l0 regularization and outer approximation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Rui Ma"},
  {name = "Rodolphe Le Riche"},
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "gurobipy>=11.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
l0mkl-copy = "l0mkl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/l0mkl"]

[tool.ruff]
line-length = 96
target-version = "py310"
